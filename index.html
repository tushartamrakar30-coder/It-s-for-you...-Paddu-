<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For myy paddu❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #4a001b, #150009 85%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }

    /* Ambient Floating Hearts */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart-float {
      position: absolute;
      color: rgba(255, 64, 129, 0.25);
      animation: floatUp 8s linear infinite;
      font-size: 20px;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      position: relative;
      z-index: 2;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Reliable Screen Visibility */
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex !important;
      animation: screenFadeIn 0.35s ease forwards;
    }

    @keyframes screenFadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Glass Card UI */
    .glass-card {
      width: 100%;
      background: rgba(24, 15, 20, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 77, 148, 0.25);
      border-radius: 30px;
      padding: 34px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 64, 129, 0.05);
      text-align: center;
      position: relative;
    }

    /* Heart Animation on Lock Screen */
    .lock-frame {
      position: relative;
      display: inline-block;
      margin: 14px 0 18px;
    }

    .lock-heart-badge {
      font-size: 46px;
      animation: heartbeat 1.3s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(255, 42, 109, 0.85));
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.18); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
    }

    .pass-input {
      width: 100%;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 77, 148, 0.4);
      border-radius: 50px;
      color: #fff;
      font-size: 20px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .pass-input:focus {
      border-color: #ff2a6d;
      box-shadow: 0 0 20px rgba(255, 42, 109, 0.6);
      background: rgba(255, 255, 255, 0.12);
    }

    .pass-input::placeholder {
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.4);
    }

    .error-shake {
      animation: shake 0.4s ease-in-out;
      border-color: #ff3344 !important;
      box-shadow: 0 0 15px rgba(255, 0, 50, 0.7) !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .error-msg {
      color: #ff6b8b;
      font-size: 13px;
      margin: 8px 0;
      min-height: 18px;
    }

    /* Headings & Texts */
    .tagline {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ff7597;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .title-large {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 600;
      color: #fff;
      margin: 10px 0 6px;
      letter-spacing: 0.5px;
    }

    .sub-head {
      font-size: 14px;
      color: #d1b8c2;
      margin-bottom: 20px;
    }

    .lead-text {
      font-size: 19px;
      font-weight: 500;
      line-height: 1.45;
      color: #f7e8ee;
      margin-bottom: 24px;
    }

    .quote-box {
      border-left: 3px solid #ff2a6d;
      padding: 12px 14px;
      text-align: left;
      margin: 18px 0 28px;
      background: rgba(255, 42, 109, 0.06);
      border-radius: 0 14px 14px 0;
    }

    .quote-box p {
      font-size: 13.5px;
      font-style: italic;
      color: #e4ccd6;
      line-height: 1.5;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 15px 20px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #ff2a6d, #d9004c);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      touch-action: manipulation;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.2s ease;
      touch-action: manipulation;
    }

    /* Gallery Grid */
    .gallery-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255, 117, 151, 0.4);
    }

    .photo-grid-20 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      margin-bottom: 34px;
    }

    .photo-card {
      width: 100%;
      height: 230px;
      border-radius: 18px;
      overflow: hidden;
      background: #25121b;
      border: 1px solid rgba(255, 117, 151, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .call-card {
      width: 100%;
      max-width: 320px;
      height: 380px;
      border-radius: 24px;
      overflow: hidden;
      margin: 0 auto 30px;
      border: 1.5px solid #ff4d94;
      box-shadow: 0 0 30px rgba(255, 42, 109, 0.35);
      background: #25121b;
    }

    .call-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Screen 3 Adoration */
    .adoration-box {
      text-align: left;
      margin: 18px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .adoration-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 42, 109, 0.08);
      border: 1px solid rgba(255, 77, 148, 0.2);
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      color: #ffe6ee;
    }

    .adoration-item span {
      font-size: 18px;
    }

    .curious-line {
      font-family: 'Dancing Script', cursive;
      font-size: 24px;
      color: #ff7597;
      text-align: center;
      margin: 8px 0 14px;
      line-height: 1.4;
    }

    .button-arena {
      position: relative;
      width: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    #runawayBtn {
      z-index: 90;
      transition: top 0.2s ease, left 0.2s ease;
      touch-action: none;
    }

    /* Screen 4 Poetry */
    .poetic-line {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      line-height: 1.55;
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
    }

    .poetic-line.cursive {
      font-family: 'Dancing Script', cursive;
      font-size: 28px;
      color: #ff6b95;
    }

    .poetic-line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Screen 5 Finale */
    .finale-box {
      text-align: center;
      padding: 40px 10px;
    }

    .crown-icon {
      font-size: 42px;
      margin-bottom: 12px;
      animation: pulseCrown 2s infinite alternate ease-in-out;
    }

    @keyframes pulseCrown {
      0% { transform: scale(1); filter: drop-shadow(0 0 5px gold); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 20px gold); }
    }

    .mine-text {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #ff7597, #ff1a60);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 15px rgba(255, 42, 109, 0.7));
    }

    #celebrationCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <audio id="bgSong" loop preload="auto">
    <source src="Elliot James Reay -.mp3" type="audio/mpeg" />
  </audio>

  <div class="bg-hearts" id="ambientHearts"></div>
  <canvas id="celebrationCanvas"></canvas>

  <div class="app-container">

    <section id="screen0" class="screen active" style="display: flex;">
      <div class="glass-card" style="padding: 40px 22px;">
        <div class="tagline">ONLY FOR SOMEONE SPECIAL</div>
        
        <div class="lock-frame">
          <div class="lock-heart-badge">💖</div>
        </div>

        <h2 style="font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 8px;">
          Locked with Love
        </h2>
        <p style="font-size: 13.5px; color: #d6b8c4; margin-bottom: 16px;">
          Enter our secret code to open this letter
        </p>

        <div style="width: 100%; margin: 10px 0;">
          <input 
            type="password" 
            id="passInput" 
            class="pass-input" 
            placeholder="Enter passcode..."
